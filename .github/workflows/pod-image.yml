name: pod-image

# Construit l'image des cellules du benchmark (docker/pod/Dockerfile) et la publie sur
# ghcr.io/micedre/onyxia-agent-bench-pod. Authentification : GITHUB_TOKEN, aucun secret a creer.
#
# Apres le PREMIER push, le paquet est prive : le passer en Public (GitHub > Packages > ce paquet >
# Package settings > Change visibility), sans quoi les pods du benchmark ne peuvent pas le tirer
# (leurs Jobs n'ont pas d'imagePullSecrets). Un workflow ne peut pas le faire.

on:
  push:
    branches: [main]
    paths:
      - "docker/pod/**"
      - ".github/workflows/pod-image.yml"
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Version de Claude Code (X.Y.Z) ; vide = celle du Dockerfile"
        required: false
        default: ""
      base_image:
        description: "Image Onyxia de base ; vide = celle du Dockerfile"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/micedre/onyxia-agent-bench-pod

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # Les images Onyxia pesent ~3 Go et l'export vers le daemon double l'espace utilise :
      # on retire les chaines d'outils preinstallees du runner dont on n'a pas besoin.
      - name: Make free space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Source unique des valeurs par defaut : les ARG du Dockerfile (pas de doublon ici).
      - name: Resolve versions
        id: v
        env:
          IN_CLAUDE: ${{ inputs.claude_version }}
          IN_BASE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          base="${IN_BASE:-$(grep -m1 '^ARG BASE_IMAGE=' docker/pod/Dockerfile | cut -d= -f2-)}"
          claude="${IN_CLAUDE:-$(grep -m1 '^ARG CLAUDE_VERSION=' docker/pod/Dockerfile | cut -d= -f2-)}"
          [[ "$claude" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version Claude invalide: $claude"; exit 1; }
          [[ -n "$base" ]] || { echo "image de base introuvable"; exit 1; }
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "claude=$claude" >> "$GITHUB_OUTPUT"
          echo "base_tag=${base##*:}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.v.outputs.base_tag }}-claude${{ steps.v.outputs.claude }}
            type=sha,format=short
            type=raw,value=latest

      # 1) build dans le daemon local, sans pousser : on teste avant de publier
      - name: Build (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: docker/pod
          file: docker/pod/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: pod-image:test
          build-args: |
            BASE_IMAGE=${{ steps.v.outputs.base }}
            CLAUDE_VERSION=${{ steps.v.outputs.claude }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Aucun jeton, aucune depense : on verifie que l'image contient ce que le benchmark suppose.
      - name: Smoke test
        env:
          CLAUDE_VERSION: ${{ steps.v.outputs.claude }}
        run: |
          set -euo pipefail
          docker run --rm pod-image:test bash -c '
            set -euo pipefail
            test "$(id -u)" = 1000
            claude --version | tee /dev/stderr | grep -F "'"$CLAUDE_VERSION"'"
            test "$DISABLE_AUTOUPDATER" = 1
            opencode --version
            uv --version; jq --version; quarto --version; git --version; tar --version >/dev/null
            python -c "import sklearn, mlflow, geopandas, matplotlib, polars, pandera, nbclient, ipykernel, pandas, pyarrow, duckdb, s3fs, pytest"
            Rscript -e "for (p in c(\"testthat\", \"renv\", \"targets\", \"lintr\")) library(p, character.only = TRUE)"
            test -s /opt/bench-image-manifest.txt
            head -n 12 /opt/bench-image-manifest.txt
          '

      # 2) meme build (couches en cache), cette fois pousse avec les vrais tags
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/pod
          file: docker/pod/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.v.outputs.base }}
            CLAUDE_VERSION=${{ steps.v.outputs.claude }}
          cache-from: type=gha

      - name: Summary
        run: |
          {
            echo "### Image publiee"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Utilisation : \`--pod-image ${IMAGE}:${{ steps.v.outputs.base_tag }}-claude${{ steps.v.outputs.claude }}\`"
            echo
            echo "Premier push : passer le paquet en **Public** (Package settings > Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
