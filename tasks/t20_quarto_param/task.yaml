id: t20_quarto_param
tags: [quarto, reporting, reproducibility]
timeout_s: 900
prompt: |
  A partir de `donnees_communes.csv` (communes avec code_region, population, revenu), il me
  faut une fiche par region : nombre de communes, population totale, revenu median des
  communes, un graphique. Une seule source Quarto parametree par region, rendue en HTML pour
  chaque region, et le tableau des indicateurs par region a part
  (`indicateurs_regions.csv`, colonnes `code_region`, `n_communes`, `population`,
  `revenu_median`) pour ceux qui ne veulent que les chiffres.
