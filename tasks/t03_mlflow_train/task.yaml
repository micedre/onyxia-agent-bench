id: t03_mlflow_train
tags: [mlflow, training, python]
# Jeu de taches (cf. --suite). L'enonce TAIT la convention que les couches de config
# fournissent : cette tache mesure donc l'apport du contexte, pas la competence du modele.
# Delta apparié C4-C0 mesure sur le run qwen3-6-all, +0.08 : l'enonce dit "a la maniere de la
# plateforme" sans dire comment ; notation objective (params et metriques loggues, pas de
# tracking local en dur).
suite: context
timeout_s: 900
# Budgets de l'axe efficiency (diagnostic ; n'entre pas dans `combined`).
# Calibres a 3x la mediane observee de la config nue C0 sur le run de reference
# qwen3-6-f278654 (plancher 150k tokens / 180 s) : une cellule au cout median de C0
# score ~0.67, une cellule 3x plus chere tombe a 0. `budget_tokens` porte sur la somme
# des tokens d'entree par tour, donc un cout FACTURE qui croit avec le nombre de tours
# (chaque tour renvoie tout le prompt) - ce n'est pas une taille de contexte.
budget_tokens: 250000
budget_s: 300
prompt: |
  A partir de `donnees_insee.csv` (present dans ce repertoire), entraine un modele simple pour
  predire `revenu_disponible` a partir de `population`. Logue l'experience dans MLflow, a la
  maniere de la plateforme (parametres, metriques, run trackes via le serveur MLflow de la
  plateforme, pas un tracking local en dur). Ecris le tout dans un script Python reexecutable.
