id: t02_eda_validation
tags: [eda, validation, python, data-quality]
timeout_s: 900
# Budgets de l'axe efficiency (diagnostic ; n'entre pas dans `combined`).
# Calibres a 3x la mediane observee de la config nue C0 sur le run de reference
# qwen3-6-f278654 (plancher 150k tokens / 180 s) : une cellule au cout median de C0
# score ~0.67, une cellule 3x plus chere tombe a 0. `budget_tokens` porte sur la somme
# des tokens d'entree par tour, donc un cout FACTURE qui croit avec le nombre de tours
# (chaque tour renvoie tout le prompt) - ce n'est pas une taille de contexte.
budget_tokens: 350000
budget_s: 240
prompt: |
  J'ai recu `donnees_insee.csv` (present dans ce repertoire) : des donnees communales avec
  la population et le revenu disponible median. Avant de m'en servir, j'aimerais savoir si on
  peut s'y fier, et avoir le revenu disponible median par departement.

  Livrables attendus, produits par un script Python reexecutable :
  - `validation_report.json` : nombre de lignes, valeurs manquantes par colonne, valeurs
    aberrantes par colonne (avec la regle utilisee) ;
  - `revenu_median_departement.csv` : une ligne par departement, colonnes `code_departement`
    et `revenu_median`.

  Il faudra que ca retourne tel quel la semaine prochaine sur une nouvelle livraison du
  fichier.
