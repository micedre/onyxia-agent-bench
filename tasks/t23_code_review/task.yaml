id: t23_code_review
tags: [code-review, security, mlops]
# Jeu de taches (cf. --suite). L'enonce TAIT la convention que les couches de config
# fournissent : cette tache mesure donc l'apport du contexte, pas la competence du modele.
# Delta apparié C4-C0 mesure sur le run qwen3-6-all, +0.20 : l'enonce demande une relecture
# "comme pour un collegue", sans lister les problemes a trouver.
suite: context
timeout_s: 600
# Budgets de l'axe efficiency (diagnostic ; n'entre pas dans `combined`).
# Valeurs provisoires : ces taches n'ont pas encore de run de reference, elles sont
# alignees sur les taches comparables deja calibrees (3x la mediane C0). A recalibrer
# apres le premier run complet, comme les taches t01-t11.
budget_tokens: 200000
budget_s: 240
prompt: |
  Peux-tu relire la PR #42 (`PR.md`, code dans `src/pipeline.py`) comme tu le ferais pour un
  collegue, et ecrire ta revue dans `review.md` ? Concentre-toi sur ce qui poserait vraiment
  probleme sur la plateforme ou pour la fiabilite des resultats, pas sur le style.
