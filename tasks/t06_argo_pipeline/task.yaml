id: t06_argo_pipeline
tags: [argo, mlops, kubernetes]
timeout_s: 900
prompt: |
  Ecris un pipeline Argo Workflows qui automatise cette analyse sur le cluster de la
  plateforme : une etape de preparation des donnees, une etape d'entrainement, une etape de
  log dans MLflow. Le pipeline doit pouvoir tourner directement sur la plateforme (pas de
  script local ni de docker-compose).
