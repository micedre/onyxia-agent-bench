id: t18_notebook_refactor
tags: [notebook, refactoring, reproducibility, security, git]
# Jeu de taches (cf. --suite). L'enonce TAIT la convention que les couches de config
# fournissent : cette tache mesure donc l'apport du contexte, pas la competence du modele.
# Delta apparié C4-C0 mesure sur le run qwen3-6-all, -0.33, CONTRE-CAS conserve volontairement
# : le contexte fait sur-construire l'agent (aucune cellule C4 ne commite, contre 4/5 en C0).
# Une suite ou C4 gagne partout demontrerait son resultat par construction.
suite: context
timeout_s: 2400
# Budgets de l'axe efficiency (diagnostic ; n'entre pas dans `combined`).
# Valeurs provisoires : ces taches n'ont pas encore de run de reference, elles sont
# alignees sur les taches comparables deja calibrees (3x la mediane C0). A recalibrer
# apres le premier run complet, comme les taches t01-t11.
budget_tokens: 700000
budget_s: 480
prompt: |
  `analyse_bas_revenus.ipynb` est le notebook d'un collegue parti en conge : il calcule la
  part de communes sous un seuil de revenu par departement (`part_communes_sous_seuil.csv`)
  a partir de `donnees_communes.csv`. Il ne tourne plus de haut en bas. Transforme-le en
  quelque chose de fiable que l'equipe puisse relancer et tester, et commite le resultat.
