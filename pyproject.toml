[project]
name = "onyxia-agent-bench"
version = "0.1.0"
description = "Benchmark de context engineering pour opencode-onyxia (logs MLflow)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mlflow>=2.10",
]

[project.scripts]
bench = "bench.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
