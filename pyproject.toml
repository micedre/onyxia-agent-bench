[project]
name = "onyxia-agent-bench"
version = "0.1.0"
description = "Benchmark de context engineering pour opencode-onyxia (logs MLflow)."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "mlflow>=2.10",
]

[project.optional-dependencies]
# environnement de notation des tasks t13+ (le code de l'agent est re-execute)
grading = ["pandas>=2.2", "pyarrow>=15", "duckdb>=1.0", "scikit-learn>=1.4", "numpy>=1.26"]

[project.scripts]
bench = "bench.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
